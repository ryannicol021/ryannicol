<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryan Nicol</title>
    <meta name="description" content="">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-loader" aria-hidden="true"></div>
    <header class="intro" id="top">
        <div class="intro-inner">
            <div class="intro-content">
                <div class="intro-name">
                    <h4>Hello, I'm</h4>
                    <h1>Ryan Nicol</h1>
                </div>
                <div class="social-links" data-section="socials"></div>
            </div>
            <div class="intro-photo">
                <img src="images/ryan.png" alt="Ryan Nicol">
            </div>
        </div>
        <div class="scroll-cue" aria-hidden="true">
            <span class="scroll-arrow"></span>
        </div>
    </header>
    <main>
        <section class="information" aria-label="Experience and background">
            <section class="resume-section" id="experience">
                <h2>Experience</h2>
                <div class="entries" data-section="experience"></div>
            </section>
            <section class="resume-section" id="education">
                <h2>Education</h2>
                <div class="entries" data-section="education"></div>
            </section>
            <section class="resume-section" id="volunteering">
                <h2>Volunteering</h2>
                <div class="entries" data-section="volunteering"></div>
            </section>
            <section class="resume-section" id="awards">
                <h2>Awards</h2>
                <div class="entries" data-section="awards"></div>
            </section>
        </section>
        <footer class="contact">
            <div class="contact-inner">
                <p class="copyright">
                    <span class="copyright-symbol">©</span>
                    <span class="copyright-year"></span>
                    Ryan Nicol. All rights reserved.
                </p>
            </div>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
